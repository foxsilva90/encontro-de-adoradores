name: AzuraCast Playlist Scheduler

on:
  schedule:
    - cron: '0 2 * * *'  # 23:00 BRT (UTC-3), 1h antes do AzuraCast recalcular agendamento
  workflow_dispatch:

jobs:
  manage-playlists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run playlist scheduler
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: python scripts/azuracast_scheduler.py

      - name: Run PG daily scheduler
        env:
          AZURACAST_API_KEY: ${{ secrets.AZURACAST_API_KEY }}
        run: python scripts/pg_daily_scheduler.py

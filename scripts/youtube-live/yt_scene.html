<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1280px;height:720px;overflow:hidden;}
body{font-family:'Raleway',sans-serif;background:linear-gradient(105deg,#0b1f3a 0%,#0d0906 100%);position:relative;}

.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.note{position:absolute;bottom:0;color:#fff;opacity:0;animation:floatNote linear infinite;}
@keyframes floatNote{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:.08}90%{opacity:.03}100%{transform:translateY(-840px) rotate(360deg);opacity:0}}

.live{position:absolute;top:34px;left:40px;display:flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:rgba(245,163,36,.12);border:1px solid rgba(245,163,36,.35);color:#F5A324;font-weight:800;font-size:15px;letter-spacing:3px;}
.live .dot{width:10px;height:10px;border-radius:50%;background:#F5A324;animation:pulse-live 1.5s ease-in-out infinite;}
@keyframes pulse-live{0%,100%{opacity:1}50%{opacity:.35}}

.stage{position:absolute;left:0;right:0;top:0;height:600px;display:flex;align-items:center;justify-content:center;}
.mic-wrap{position:relative;display:flex;align-items:center;justify-content:center;animation:float 5s ease-in-out infinite;}
.mic-grad-ring{position:absolute;width:424px;height:424px;border-radius:50%;background:conic-gradient(from 0deg,rgba(245,163,36,.85) 0%,rgba(26,79,138,.85) 35%,transparent 50%,rgba(26,79,138,.85) 65%,rgba(245,163,36,.85) 100%);animation:spin-ring 5s linear infinite;filter:blur(1px);}
.mic-ring{position:absolute;border-radius:50%;}
.mic-ring-1{width:453px;height:453px;border:2px solid rgba(245,163,36,.5);animation:pulse-ring 3s ease-out infinite;}
.mic-ring-2{width:500px;height:500px;border:1.5px solid rgba(37,99,176,.4);animation:pulse-ring 3s ease-out infinite -2.2s;}
.mic-ring-3{width:547px;height:547px;border:1px solid rgba(245,163,36,.2);animation:pulse-ring 3s ease-out infinite -1.4s;}
.mic-circle{width:400px;height:400px;border-radius:50%;background:#fff;position:relative;z-index:1;box-shadow:0 0 0 3px rgba(245,163,36,.35),0 0 40px rgba(245,163,36,.18),0 20px 60px rgba(0,0,0,.6);overflow:hidden;}
.mic-circle img{width:100%;height:100%;object-fit:cover;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin-ring{to{transform:rotate(360deg)}}
@keyframes pulse-ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.1);opacity:0}}

.caption{position:absolute;left:0;right:0;top:612px;text-align:center;}
.title{font-weight:900;font-size:46px;color:#fff;line-height:1.05;}
.title span{color:#F5A324;}
.sub{margin-top:10px;font-weight:700;font-size:15px;letter-spacing:5px;color:rgba(255,255,255,.5);text-transform:uppercase;}
</style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="live"><span class="dot"></span>AO VIVO</div>

<div class="stage">
  <div class="mic-wrap">
    <div class="mic-grad-ring"></div>
    <span class="mic-ring mic-ring-1"></span>
    <span class="mic-ring mic-ring-2"></span>
    <span class="mic-ring mic-ring-3"></span>
    <div class="mic-circle">
      <img src="../../logo_tunein_1200x1200.jpg" alt="">
    </div>
  </div>
</div>

<div class="caption">
  <div class="title">Encontro de <span>Adoradores</span></div>
  <div class="sub">Rádio Gospel Online · 24h ao vivo</div>
</div>

<script>
// Notas com posição/tempo fixos (não aleatórios) e durações que dividem 15s,
// pra cena inteira repetir perfeitamente a cada 15s.
var NOTES = [
  ['♪', 6, 15, -2, 22], ['♫', 14, 7.5, -5, 18], ['♩', 22, 15, -9, 26], ['♬', 31, 7.5, -1, 20],
  ['♪', 40, 15, -12, 17], ['♫', 49, 5, -3, 24], ['♩', 58, 15, -6, 19], ['♬', 66, 7.5, -4, 28],
  ['♪', 74, 15, -14, 21], ['♫', 82, 5, -1.5, 16], ['♩', 89, 7.5, -6.5, 25], ['♬', 95, 15, -10, 20]
];
var p = document.getElementById('particles');
NOTES.forEach(function (n) {
  var el = document.createElement('span');
  el.className = 'note';
  el.textContent = n[0];
  el.style.left = n[1] + '%';
  el.style.animationDuration = n[2] + 's';
  el.style.animationDelay = n[3] + 's';
  el.style.fontSize = n[4] + 'px';
  p.appendChild(el);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo_tunein_1200x1200.png" type="image/png">
<title>Encontro de Adoradores — Rádio Gospel Online</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800;900&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#040d18 0%,#0d2a4a 50%,#040d18 100%);display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;}

/* Partículas de fundo */
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.note{position:absolute;font-size:20px;opacity:.06;animation:floatNote linear infinite;}
@keyframes floatNote{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:.08}90%{opacity:.03}100%{transform:translateY(-120px) rotate(360deg);opacity:0}}

/* Container central */
.entry-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;position:relative;z-index:1;}

/* Logo animada */
.mic-wrap{position:relative;display:flex;align-items:center;justify-content:center;animation:float 5s ease-in-out infinite;margin-bottom:40px;}
.mic-grad-ring{position:absolute;width:318px;height:318px;border-radius:50%;background:conic-gradient(from 0deg,rgba(245,163,36,.85) 0%,rgba(26,79,138,.85) 35%,transparent 50%,rgba(26,79,138,.85) 65%,rgba(245,163,36,.85) 100%);animation:spin-ring 5s linear infinite;filter:blur(1px);z-index:0;}
.mic-ring{position:absolute;border-radius:50%;pointer-events:none;}
.mic-ring-1{width:340px;height:340px;border:2px solid rgba(245,163,36,.5);animation:pulse-ring 3s ease-out infinite;}
.mic-ring-2{width:375px;height:375px;border:1.5px solid rgba(37,99,176,.4);animation:pulse-ring 3s ease-out infinite .8s;}
.mic-ring-3{width:410px;height:410px;border:1px solid rgba(245,163,36,.2);animation:pulse-ring 3s ease-out infinite 1.6s;}
.mic-circle{width:300px;height:300px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(245,163,36,.35),0 0 40px rgba(245,163,36,.18),0 20px 60px rgba(0,0,0,.6);position:relative;z-index:1;}
.mic-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes spin-ring{to{transform:rotate(360deg)}}
@keyframes pulse-ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.1);opacity:0}}

/* Texto */
.entry-title{font-family:'Raleway',sans-serif;font-weight:900;font-size:clamp(36px,6vw,64px);color:#fff;line-height:1.05;margin-bottom:4px;}
.entry-title span{color:#F5A324;}
.entry-sub{font-family:'Raleway',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.45);text-transform:uppercase;margin-bottom:36px;}

/* Botão */
.btn-enter{display:inline-flex;align-items:center;gap:10px;background:#F5A324;color:#080808;font-family:'Raleway',sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;padding:16px 40px;border-radius:9999px;text-decoration:none;box-shadow:0 8px 32px rgba(245,163,36,.35);transition:.25s;}
.btn-enter:hover{background:#D4881A;transform:translateY(-2px);box-shadow:0 12px 40px rgba(245,163,36,.5);}
.btn-enter svg{flex-shrink:0;}

/* Mobile */
@media(max-width:480px){
  .mic-circle{width:220px;height:220px;}
  .mic-grad-ring{width:234px;height:234px;}
  .mic-ring-1{width:252px;height:252px;}
  .mic-ring-2{width:276px;height:276px;}
  .mic-ring-3{width:300px;height:300px;}
  .mic-wrap{margin-bottom:28px;}
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="entry-wrap">
  <div class="mic-wrap">
    <div class="mic-grad-ring"></div>
    <span class="mic-ring mic-ring-1"></span>
    <span class="mic-ring mic-ring-2"></span>
    <span class="mic-ring mic-ring-3"></span>
    <div class="mic-circle">
      <img src="logo_tunein_1200x1200.jpg" alt="Encontro de Adoradores">
    </div>
  </div>

  <h1 class="entry-title">Encontro de<br><span>Adoradores</span></h1>
  <p class="entry-sub">Rádio Gospel Online</p>

  <a href="radio.html" class="btn-enter">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    Entrar e Ouvir
  </a>
</div>

<script>
(function(){
  var notes = ['♪','♫','♩','♬'];
  var p = document.getElementById('particles');
  for(var i=0;i<12;i++){
    var n = document.createElement('span');
    n.className = 'note';
    n.textContent = notes[i%4];
    n.style.left = (Math.random()*100)+'%';
    n.style.animationDuration = (8+Math.random()*14)+'s';
    n.style.animationDelay = (Math.random()*10)+'s';
    n.style.fontSize = (14+Math.random()*16)+'px';
    p.appendChild(n);
  }
})();
</script>
</body>
</html>
